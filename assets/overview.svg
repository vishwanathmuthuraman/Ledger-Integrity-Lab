<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">Ledger Integrity Lab</title><desc id="desc">A proposed evidence-first workflow: inspect ledger entries, validate accounting structure, prioritize review and explain the evidence.</desc><rect width="1200" height="350" rx="22" fill="#102c37"/><circle cx="1150" cy="-50" r="230" fill="#183e48"/><text x="48" y="56" fill="#8ee2ce" font-family="Arial,sans-serif" font-size="16" letter-spacing="3">ACCOUNTING INTEGRITY · RESEARCH BLUEPRINT</text><text x="48" y="115" fill="#f7f4e9" font-family="Arial,sans-serif" font-weight="700" font-size="40">Find the entries worth a closer look.</text><text x="48" y="152" fill="#bfd0d3" font-family="Arial,sans-serif" font-size="19">Exact accounting. Time-aware context. Evidence a human can verify.</text><g font-family="Arial,sans-serif"><rect x="48" y="202" width="243" height="84" rx="12" fill="#f7f4e9"/><text x="67" y="234" fill="#33555c" font-size="13">01 / IMPORT</text><text x="67" y="262" fill="#102c37" font-size="20" font-weight="700">Ledger &amp; evidence</text><rect x="326" y="202" width="243" height="84" rx="12" fill="#f7f4e9"/><text x="345" y="234" fill="#33555c" font-size="13">02 / VALIDATE</text><text x="345" y="262" fill="#102c37" font-size="20" font-weight="700">Balance &amp; coverage</text><rect x="604" y="202" width="243" height="84" rx="12" fill="#f7f4e9"/><text x="623" y="234" fill="#33555c" font-size="13">03 / PRIORITIZE</text><text x="623" y="262" fill="#102c37" font-size="20" font-weight="700">Linked signals</text><rect x="882" y="202" width="270" height="84" rx="12" fill="#8ee2ce"/><text x="901" y="234" fill="#33555c" font-size="13">04 / REVIEW</text><text x="901" y="262" fill="#102c37" font-size="20" font-weight="700">Evidence &amp; unknowns</text><text x="303" y="254" fill="#8ee2ce" font-size="23">→</text><text x="581" y="254" fill="#8ee2ce" font-size="23">→</text><text x="859" y="254" fill="#8ee2ce" font-size="23">→</text></g><text x="48" y="323" fill="#bfd0d3" font-family="Arial,sans-serif" font-size="14">Illustrative architecture · Application and benchmark not yet implemented</text></svg>